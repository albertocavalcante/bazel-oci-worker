name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (types + registry)
        run: cargo clippy -p bazel-oci-types -p bazel-oci-registry --all-targets -- -D warnings

      - name: Clippy (worker)
        run: cargo clippy -p bazel-oci-worker --target wasm32-unknown-unknown -- -D warnings

      - name: Test (types + registry)
        run: cargo test -p bazel-oci-types -p bazel-oci-registry
