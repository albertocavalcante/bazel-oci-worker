name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (types + registry)
        run: cargo clippy -p bazel-oci-types -p bazel-oci-registry --all-targets -- -D warnings

      - name: Clippy (worker)
        run: cargo clippy -p bazel-oci-worker --target wasm32-unknown-unknown -- -D warnings

      - name: Test (types + registry)
        run: cargo test -p bazel-oci-types -p bazel-oci-registry
